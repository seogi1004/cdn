<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[프로토타입] DB 검색 x 성능 브라우저</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 조건 작성(위) → 적용 결과(아래: 상태·칩·드릴 바·차트+표). 한 화면 작업대. */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF; --surface-2: #F0F3F8; --line: #DCE2EB; --line-strong: #C5CEDB;
  --fg: #1A2332; --muted: #5C6A7E; --faint: #8794A7;
  --accent: #2C67E6; --accent-weak: #E6EEFD; --accent-fg: #FFFFFF;
  --warn: #9A6410; --warn-bg: #FFF4DE; --danger: #C93838; --danger-bg: #FCEBEB; --ok: #1C8E61;
  --sel: rgba(44,103,230,.13); --sel-line: rgba(44,103,230,.55); --hover: #EDF2FB; --grid: #E8ECF2;
  --font-ui: "IBM Plex Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E131B; --surface: #151C27; --surface-2: #1B2431; --line: #29344A; --line-strong: #3A475E;
  --fg: #E3E9F2; --muted: #98A6BB; --faint: #6E7C92;
  --accent: #6E9BFF; --accent-weak: #1C2B48; --accent-fg: #0E131B;
  --warn: #E6B451; --warn-bg: #352A12; --danger: #FF8080; --danger-bg: #3A1D1F; --ok: #45C993;
  --sel: rgba(110,155,255,.17); --sel-line: rgba(110,155,255,.65); --hover: #1D2736; --grid: #222C3B;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #151C27; --surface-2: #1B2431; --line: #29344A; --line-strong: #3A475E;
  --fg: #E3E9F2; --muted: #98A6BB; --faint: #6E7C92;
  --accent: #6E9BFF; --accent-weak: #1C2B48; --accent-fg: #0E131B;
  --warn: #E6B451; --warn-bg: #352A12; --danger: #FF8080; --danger-bg: #3A1D1F; --ok: #45C993;
  --sel: rgba(110,155,255,.17); --sel-line: rgba(110,155,255,.65); --hover: #1D2736; --grid: #222C3B;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; line-height: 1.45; }
.app { max-width: 1440px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.top h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; background: var(--surface); }
.top .sp { flex: 1; }
.guide { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0; }
.guide summary { padding: 9px 14px; cursor: pointer; font-weight: 500; color: var(--muted); }
.guide ul { margin: 0; padding: 0 14px 12px 32px; display: grid; gap: 4px; color: var(--muted); }
.guide b { color: var(--fg); font-weight: 600; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--fg); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.pulse { box-shadow: 0 0 0 3px var(--accent-weak); }
.ibtn { width: 24px; height: 24px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: 4px; color: var(--muted); padding: 0; }
.ibtn:hover { background: var(--hover); color: var(--fg); }
.ibtn svg, .btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* conditions panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.cond { display: grid; }
.basebar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.field { display: inline-flex; align-items: center; gap: 6px; }
.field > .k { font-size: 12px; color: var(--muted); }
.ctl { height: 30px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 0 8px; min-width: 0; }
select.ctl { padding-right: 4px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; }
.chk input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.basebar .sp { flex: 1; }
.dirty { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--warn); background: var(--warn-bg); border-radius: 99px; padding: 3px 10px; }
.dirty::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.groups { display: grid; gap: 0; }
.gcard { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.gcard:last-child { border-bottom: 0; }
.gname { font-weight: 600; font-size: 12.5px; display: grid; gap: 1px; }
.gname small { font-weight: 400; color: var(--faint); font-size: 11px; }
.slots { display: flex; flex-wrap: wrap; gap: 8px 6px; align-items: center; min-width: 0; }
.slot { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.slot + .slot::before { content: "→"; color: var(--faint); margin-right: 2px; }
.slot .k { font-size: 11px; color: var(--faint); white-space: nowrap; }
.slot .k b { font-family: var(--font-data); color: var(--muted); font-weight: 500; margin-right: 3px; }
.tfield { display: inline-flex; align-items: center; gap: 6px; height: 30px; max-width: 280px; min-width: 120px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 0 8px; text-align: left; }
.tfield:hover { border-color: var(--accent); }
.tfield.empty { color: var(--faint); border-style: dashed; }
.tfield .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tfield .more { font-size: 11px; background: var(--accent-weak); color: var(--accent); border-radius: 99px; padding: 0 6px; font-weight: 600; }
.tfield .kd { font-size: 10.5px; color: var(--faint); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.gacts { display: flex; gap: 2px; }
.gnote { grid-column: 2 / 4; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); }
.gnote .warn { color: var(--warn); }
.gnote .err { color: var(--danger); }
.gnote .yield b { color: var(--fg); font-weight: 600; }
.addrow { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.addrow .hint { color: var(--faint); font-size: 12px; }

/* results */
.res { display: grid; gap: 0; position: relative; }
.resbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.applied { font-size: 12.5px; color: var(--muted); min-width: 0; }
.applied b { color: var(--fg); font-weight: 600; }
.resbar .sp { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); height: 28px; padding: 0 10px; font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); font-weight: 600; }

.chips { display: grid; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.cgrp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cglabel { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; min-width: 0; }
.cglabel b { color: var(--fg); font-weight: 600; }
.chip { --c: var(--accent); display: inline-flex; align-items: center; gap: 2px; height: 26px; border: 1px solid var(--line); border-radius: 99px; padding: 0 4px 0 8px; background: var(--surface); font-size: 12px; max-width: 100%; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.chip .tg { border: 0; background: transparent; display: inline-flex; align-items: center; gap: 6px; padding: 0 4px 0 0; height: 24px; }
.chip.off { opacity: .5; }
.chip.off .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.chip.off .tg span { text-decoration: line-through; }
.chip.emph { border-color: var(--c); }
.chip.fail { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); padding-right: 8px; }
.chip .ibtn { width: 22px; height: 22px; }
.chip .when { color: var(--faint); font-size: 11px; }

.drillbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 12px; min-width: 0; }
.crumbs button { border: 0; background: transparent; padding: 3px 6px; border-radius: 4px; color: var(--accent); }
.crumbs button:hover { background: var(--accent-weak); }
.crumbs .cur { padding: 3px 6px; font-weight: 600; color: var(--fg); }
.crumbs .sep { color: var(--faint); }
.api { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; border-radius: 4px; padding: 2px 8px; border: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; }
.api i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.api.sec i { background: var(--accent); }
.drillbar .sp { flex: 1; }
.selinfo { font-size: 12px; color: var(--muted); display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.selinfo b { color: var(--fg); font-weight: 600; }
.why { color: var(--warn); font-size: 12px; }
.fallbacks { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.fb { font-size: 11.5px; color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 2px 8px; }

.body { display: grid; gap: 0; min-width: 0; }
.body.side { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.body.side .tblwrap { border-left: 1px solid var(--line); }
.body.stack .tblwrap { border-top: 1px solid var(--line); }
@media (max-width: 900px) { .body.side { grid-template-columns: minmax(0,1fr); } .body.side .tblwrap { border-left: 0; border-top: 1px solid var(--line); } }

.charts { display: grid; gap: 4px; padding: 8px 6px 6px; min-width: 0; }
.chart { min-width: 0; }
.ctool { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 0 8px 4px; }
.ctool .k { font-size: 11.5px; color: var(--faint); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.chead { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 0 8px; font-size: 12px; }
.chead b { font-weight: 600; }
.chead span { color: var(--faint); font-size: 11.5px; }
.plot { position: relative; user-select: none; touch-action: none; }
.plot svg { display: block; width: 100%; }
.plot .ax { fill: var(--faint); font-size: 10.5px; font-family: var(--font-data); }
.plot .gl { stroke: var(--grid); stroke-width: 1; }
.plot .base { stroke: var(--line-strong); }
.plot .ln { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
.plot .selr { fill: var(--sel); stroke: var(--sel-line); stroke-width: 1; }
.plot .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.plot .ov { fill: transparent; cursor: crosshair; }
.tip { position: absolute; top: 6px; z-index: 3; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 7px 9px; font-size: 11.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 170px; max-width: 280px; }
.tip .th { font-family: var(--font-data); color: var(--muted); margin-bottom: 4px; }
.tip .tr { display: grid; grid-template-columns: 9px 1fr auto; gap: 6px; align-items: center; }
.tip .tr i { width: 8px; height: 8px; border-radius: 50%; }
.tip .tr small { color: var(--faint); display: block; font-size: 10.5px; }
.tip .tv { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; }

.tblwrap { min-width: 0; display: grid; }
.tblscroll { overflow: auto; position: relative; outline: none; }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 12px; min-width: 100%; }
.grid th, .grid td { border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); padding: 0 10px; height: 28px; white-space: nowrap; }
.grid thead th { position: sticky; background: var(--surface-2); z-index: 2; font-weight: 500; text-align: left; }
.grid thead tr:first-child th { top: 0; height: 30px; }
.grid thead tr:nth-child(2) th { top: 30px; }
.grid thead th.gh { font-size: 11.5px; color: var(--muted); border-bottom-color: var(--line-strong); }
.grid thead th.gh b { color: var(--fg); font-weight: 600; }
.grid thead th.gstart, .grid td.gstart { border-left: 2px solid var(--line-strong); }
.grid thead th.sh { cursor: pointer; }
.grid thead th.sh i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.grid thead th.sh small { color: var(--faint); margin-left: 4px; }
.grid .tc { position: sticky; left: 0; z-index: 1; background: var(--surface); font-family: var(--font-data); font-variant-numeric: tabular-nums; cursor: cell; min-width: 112px; }
.grid thead .tc { z-index: 4; background: var(--surface-2); cursor: default; }
.grid td.tc .dr { visibility: hidden; margin-left: 6px; height: 20px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 4px; font-size: 11px; padding: 0 5px; color: var(--accent); font-family: var(--font-ui); vertical-align: middle; }
.grid tr:hover td.tc .dr, .grid tr.is-hover td.tc .dr { visibility: visible; }
.grid td.v { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; cursor: default; min-width: 92px; }
.grid td.v.na { color: var(--faint); text-align: center; }
.grid .off { opacity: .32; }
.grid th.emph, .grid td.emph { box-shadow: inset 0 0 0 9999px var(--hover); }
.grid tr.is-hover td { background: var(--hover); }
.grid tr.is-hover td.tc { background: var(--hover); }
.grid tr.is-sel td { background: var(--sel); }
.grid tr.is-sel td.tc { background: color-mix(in srgb, var(--surface) 70%, var(--accent) 30%); color: var(--fg); font-weight: 500; }
.grid td.cell { outline: 2px solid var(--accent); outline-offset: -2px; }
.grid tr.sp td { border: 0; padding: 0; height: auto; background: transparent; }
.tblsel { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 7px 12px; background: var(--accent-weak); border-top: 1px solid var(--line); }
.tblsel[hidden] { display: none; }
.tblfoot { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 12px; font-size: 11.5px; color: var(--faint); border-top: 1px solid var(--line); }

.empty-state { padding: 48px 20px; text-align: center; color: var(--muted); }
.loading { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 55%, transparent); border-radius: var(--r); }
.loading div { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 10px 16px; display: inline-flex; gap: 10px; align-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-weak); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

/* popover, drawer, toast */
.pop { position: fixed; z-index: 30; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: 0 10px 28px rgba(0,0,0,.18); padding: 6px; min-width: 220px; max-width: min(320px, calc(100vw - 32px)); }
.pop h4 { margin: 4px 8px 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.pop .opt { display: flex; width: 100%; justify-content: space-between; gap: 10px; border: 0; background: transparent; padding: 7px 8px; border-radius: 4px; text-align: left; }
.pop .opt:hover:not(:disabled) { background: var(--hover); }
.pop .opt:disabled { opacity: .45; cursor: not-allowed; }
.pop .opt small { color: var(--faint); }
.pop .row { display: flex; gap: 6px; padding: 6px 8px; align-items: center; border-top: 1px solid var(--line); margin-top: 4px; }

.scrim { position: fixed; inset: 0; background: rgba(10,15,25,.28); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(400px, 100vw); background: var(--surface); border-left: 1px solid var(--line-strong); display: grid; grid-template-rows: auto auto auto auto auto 1fr auto; box-shadow: -10px 0 30px rgba(0,0,0,.15); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dh { display: flex; align-items: center; gap: 8px; padding: 14px 16px 4px; }
.dh h3 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
.dperiod { padding: 0 16px 10px; font-size: 12px; color: var(--muted); }
.dtabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 12px; }
.dtabs button { border: 0; background: transparent; padding: 8px 10px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.dtabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.dconfirm { margin: 10px 16px 0; padding: 10px; background: var(--warn-bg); color: var(--warn); border-radius: var(--r); font-size: 12px; display: grid; gap: 8px; }
.dconfirm div { display: flex; gap: 6px; justify-content: flex-end; }
.dsearch { padding: 10px 16px 6px; display: grid; gap: 8px; }
.dsearch .ctl { width: 100%; }
.dtool { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dtool .sp { flex: 1; }
.dbody { overflow: auto; padding: 4px 8px; border-top: 1px solid var(--line); }
.trow { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 4px; }
.trow:hover { background: var(--hover); }
.trow.child { padding-left: 30px; }
.trow input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.trow .chev { width: 18px; height: 18px; border: 0; background: transparent; padding: 0; color: var(--muted); display: grid; place-items: center; }
.trow .chev svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; transition: transform .15s; }
.trow .chev.open svg { transform: rotate(90deg); }
.trow label { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; cursor: pointer; }
.trow .st { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.trow .st.stop { background: var(--faint); }
.trow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .sub { color: var(--faint); font-size: 11px; white-space: nowrap; }
.trow.parent .nm { font-weight: 500; }
.dfoot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.dfoot .sp { flex: 1; }


/* 조건 요약 줄 */
.grow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 6px; padding: 4px 10px 4px 6px; border-bottom: 1px solid var(--line); }
.gmain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 0; background: transparent; text-align: left; padding: 7px 8px; border-radius: var(--r); min-width: 0; }
.gmain:hover { background: var(--hover); }
.gmain:hover .edit { color: var(--accent); }
.gno { font-weight: 600; font-size: 12.5px; margin-right: 4px; }
.tok { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; background: var(--surface); font-size: 12px; max-width: 100%; }
.tok em { font-style: normal; color: var(--faint); font-size: 11px; }
.tok.miss { border-style: dashed; color: var(--danger); }
.gmain .yield { color: var(--muted); font-size: 12px; }
.gmain .edit { margin-left: auto; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
.grow .gnote { grid-column: 1 / -1; padding: 0 8px 6px; }
/* 조건 편집 패널 */
.drawer.ed { width: min(480px, 100vw); grid-template-rows: auto auto 1fr auto; }
.esum { padding: 0 16px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.esum b { color: var(--fg); font-weight: 600; }
.ebody { overflow: auto; padding: 14px 16px 20px; display: grid; gap: 22px; align-content: start; }
.esec h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.esec h4 b { font-family: var(--font-data); font-size: 11px; color: var(--accent); background: var(--accent-weak); border-radius: 99px; width: 18px; height: 18px; display: inline-grid; place-items: center; }
.esec h4 span { font-weight: 400; font-size: 11.5px; color: var(--faint); }
.esec.flash { animation: flash 1.8s ease-out; border-radius: var(--r); }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 8px var(--accent-weak); background: var(--accent-weak); } 100% { box-shadow: 0 0 0 8px transparent; background: transparent; } }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt2 { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 5px 10px; display: grid; text-align: left; font-size: 12.5px; line-height: 1.3; }
.opt2 small { color: var(--faint); font-size: 11px; }
.opt2.one { padding: 6px 10px; }
.opt2:hover:not(:disabled) { border-color: var(--accent); }
.opt2:disabled { opacity: .4; cursor: not-allowed; }
.opt2[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.opt2[aria-pressed="true"] small { color: var(--accent); }
.ed .dtabs { padding: 0; }
.ed .dsearch { padding: 8px 0 6px; }
.ed .dconfirm { margin: 8px 0 0; }
.tree { border: 1px solid var(--line); border-radius: var(--r); max-height: 250px; overflow: auto; padding: 4px; }
.mlist { display: grid; gap: 4px; }
.mrow { display: flex; gap: 8px; align-items: baseline; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: left; }
.mrow:hover { border-color: var(--accent); }
.mrow.on { border-color: var(--accent); background: var(--accent-weak); }
.mrow.on span { color: var(--accent); font-weight: 600; }
.mrow small { color: var(--faint); font-size: 11.5px; }
.mrow small:first-of-type { margin-left: auto; }
.mrow small.no { color: var(--warn); }
.efoot { border-top: 1px solid var(--line); padding: 10px 16px 12px; display: grid; gap: 10px; }
.eres { font-size: 12px; color: var(--muted); line-height: 1.55; }
.eres b { color: var(--fg); font-weight: 600; }
.eres .err { color: var(--danger); display: block; margin-top: 2px; }
.ebtns { display: flex; gap: 6px; }
.ebtns .sp { flex: 1; }


/* 조건 그룹 모달 */
.gbtn { gap: 6px; }
.gbtn b { font-weight: 600; color: var(--accent); }
.gbtn small { color: var(--faint); font-size: 11px; }
.ddot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.scrim.gm { z-index: 34; }
.gmodal { position: fixed; z-index: 35; left: 50%; top: max(48px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 96px); display: grid; grid-template-rows: auto auto 1fr auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 18px 48px rgba(0,0,0,.25); }
.gmodal .dh { padding: 14px 16px 4px; }
.gmsub { margin: 0; padding: 0 16px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.gmbody { overflow: auto; }
.gmbody .grow:last-child { border-bottom: 0; }
.gmfoot { display: flex; gap: 6px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
.gmfoot .sp { flex: 1; }
.plot .zl { stroke: var(--line-strong); }
.tip .tv small { display: block; color: var(--faint); font-size: 10.5px; }

.plot .pdiv { stroke: var(--line-strong); stroke-width: 1; }
.plot .ytitle { font-size: 10.5px; dominant-baseline: hanging; }
.plot .ytitle .pn { fill: var(--fg); font-weight: 600; }
.plot .ytitle .pu { fill: var(--faint); }
.tip .tsec { margin: 6px 0 2px; padding-top: 4px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--muted); font-weight: 600; }
.tip .tsec:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
/* 조건 그룹별 툴팁: 차트와 표가 같은 구조를 사용 */
.tip { min-width: 230px; max-width: min(360px, calc(100vw - 24px)); padding: 8px; background: var(--surface-200); border-color: var(--gray-300); box-shadow: var(--box-shadow-500); }
.tip .th { color: var(--gray-600); font-size: 11px; line-height: 18px; margin-bottom: 6px; }
.tip-group { border: 1px solid var(--gray-200); border-radius: 5px; padding: 7px 8px; }
.tip-group + .tip-group { margin-top: 6px; }
.tip-group-title { font-size: 12px; line-height: 18px; font-weight: 700; color: var(--gray-900); }
.tip-group-period { margin: 1px 0 6px; color: var(--gray-600); font-size: 10px; line-height: 16px; overflow-wrap: anywhere; }
.tip .tr { grid-template-columns: 8px minmax(0, 1fr) auto; }
.tip .tr + .tr { margin-top: 5px; }
.tip .tr > span { min-width: 0; }
.tip .tr > span:not(.tv) { overflow-wrap: anywhere; }
.tip .tr small { color: var(--gray-600); font-size: 10px; line-height: 15px; }
.tip-unit { margin-left: 3px; color: var(--gray-600); font-family: var(--font-ui); font-size: 10px; }
.tip-empty { color: var(--gray-600); font-family: var(--font-ui); font-size: 11px; }
.table-tip { position: fixed; top: auto; z-index: 25; width: min(360px, calc(100vw - 24px)); min-width: 0; max-height: calc(100vh - 24px); overflow: hidden; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); border-radius: var(--r); padding: 9px 12px 9px 14px; display: flex; gap: 12px; align-items: center; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
.toast button { border: 0; background: transparent; color: inherit; font-weight: 600; text-decoration: underline; padding: 0; }

@media (max-width: 640px) {
  .gcard { grid-template-columns: 1fr auto; }
  .gcard .slots { grid-column: 1 / 3; grid-row: 2; }
  .gnote { grid-column: 1 / 3; }
  .slot + .slot::before { display: none; }
  .tfield { max-width: 100%; }
}

/* ===== JENNIFER5 디자인 시스템 (vue-components-v2 토큰·규칙). 차트·표 스타일은 손대지 않음 ===== */
:root { --gray-50:#FFFFFF;--gray-100:#F3F3F5;--gray-200:#E9E9EE;--gray-300:#D1D1D5;--gray-400:#B3B3B8;--gray-500:#94949A;--gray-600:#75757C;--gray-700:#5A5A61;--gray-800:#3E3E45;--gray-900:#222229;
  --purple-100:#F2ECFF;--purple-200:#E9DFFF;--purple-300:#DBCBFF;--purple-400:#C5AAFF;--purple-500:#B08DFD;--purple-600:#9668FD;--purple-700:#8652FF;--purple-800:#653BD8;--purple-900:#3E2871;

  --box-shadow-100:0 2px 2px rgba(0,0,0,.04),0 8px 16px -4px rgba(0,0,0,.04);--box-shadow-400:0 0 1px 0 rgba(0,0,0,.16),0 6px 12px 0 rgba(0,0,0,.08);--box-shadow-700:0 0 1px 0 rgba(0,0,0,.16),0 2px 8px 0 rgba(0,0,0,.04),0 20px 32px 0 rgba(0,0,0,.08);
  --mask:rgba(0,0,0,.4);
  --primary-100:var(--purple-100);--primary-200:var(--purple-200);--primary-300:var(--purple-300);--primary-700:var(--purple-700);--primary-800:var(--purple-800);--primary-900:var(--purple-900);--overlay-primary-100:var(--overlay-purple-100);--on-primary:#FFFFFF;
  --font-ui:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --gray-50:#18171C;--gray-100:#2C2A30;--gray-200:#333137;--gray-300:#4F4C56;--gray-400:#68656E;--gray-500:#828087;--gray-600:#9D9BA1;--gray-700:#B4B4B8;--gray-800:#D8D7DA;--gray-900:#EFEFEF;
  --purple-100:#291A3D;--purple-200:#34204D;--purple-300:#47296F;--purple-400:#6436A1;--purple-500:#7D4FD0;--purple-600:#885CE6;--purple-700:#9269F2;--purple-800:#AB8CF8;--purple-900:#D2C0FC;
  --orange-100:#3B2015;--orange-700:#F9943C;--orange-800:#FFA251;--red-100:#3A1C1F;--red-600:#E54049;--red-700:#F44B54;--red-800:#FF6B74;--green-700:#4ABA79;--blue-100:#17253C;--blue-700:#487DFF;--blue-900:#A7C0FF;
  --surface-50:#211F24;--surface-100:#18171C;--surface-200:#211F24;--surface-300:#2C2A30;
  --overlay-100:rgba(255,255,255,.05);--overlay-200:rgba(255,255,255,.08);--overlay-300:rgba(255,255,255,.12);--overlay-900:rgba(255,255,255,.85);--overlay-purple-100:rgba(121,74,233,.12);--overlay-purple-200:rgba(121,74,233,.18);
  --box-shadow-100:0 0 1px 0 rgba(255,255,255,.4),0 8px 16px -4px rgba(0,0,0,.4),0 2px 2px 0 rgba(0,0,0,.16);--box-shadow-400:0 0 1px 0 rgba(255,255,255,.4),0 6px 12px 0 rgba(0,0,0,.4);--box-shadow-700:0 0 1px 0 rgba(255,255,255,.4),0 2px 8px 0 rgba(0,0,0,.32),0 20px 32px 0 rgba(0,0,0,.4);
  --mask:rgba(0,0,0,.6); } }
:root[data-theme="dark"] { --gray-50:#18171C;--gray-100:#2C2A30;--gray-200:#333137;--gray-300:#4F4C56;--gray-400:#68656E;--gray-500:#828087;--gray-600:#9D9BA1;--gray-700:#B4B4B8;--gray-800:#D8D7DA;--gray-900:#EFEFEF;
  --purple-100:#291A3D;--purple-200:#34204D;--purple-300:#47296F;--purple-400:#6436A1;--purple-500:#7D4FD0;--purple-600:#885CE6;--purple-700:#9269F2;--purple-800:#AB8CF8;--purple-900:#D2C0FC;
  --orange-100:#3B2015;--orange-700:#F9943C;--orange-800:#FFA251;--red-100:#3A1C1F;--red-600:#E54049;--red-700:#F44B54;--red-800:#FF6B74;--green-700:#4ABA79;--blue-100:#17253C;--blue-700:#487DFF;--blue-900:#A7C0FF;
  --surface-50:#211F24;--surface-100:#18171C;--surface-200:#211F24;--surface-300:#2C2A30;
  --overlay-100:rgba(255,255,255,.05);--overlay-200:rgba(255,255,255,.08);--overlay-300:rgba(255,255,255,.12);--overlay-900:rgba(255,255,255,.85);--overlay-purple-100:rgba(121,74,233,.12);--overlay-purple-200:rgba(121,74,233,.18);
  --box-shadow-100:0 0 1px 0 rgba(255,255,255,.4),0 8px 16px -4px rgba(0,0,0,.4),0 2px 2px 0 rgba(0,0,0,.16);--box-shadow-400:0 0 1px 0 rgba(255,255,255,.4),0 6px 12px 0 rgba(0,0,0,.4);--box-shadow-700:0 0 1px 0 rgba(255,255,255,.4),0 2px 8px 0 rgba(0,0,0,.32),0 20px 32px 0 rgba(0,0,0,.4);
  --mask:rgba(0,0,0,.6); }
body { background: var(--surface-50); color: var(--gray-900); font-family: var(--font-ui); font-size: 14px; line-height: 22px; }
:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--gray-700); }
/* 타이포: 400/700, typo-* 크기 */
.top h1 { font-size: 22px; line-height: 32px; font-weight: 700; letter-spacing: 0; }
.tag { font-size: 12px; line-height: 18px; color: var(--gray-800); background: var(--gray-100); border: 0; border-radius: 4px; padding: 1px 8px; }
/* 패널: surface-100 + box-shadow-100, 컨테이너 반경 8px */
.panel, .guide { background: var(--surface-100); border: 0; border-radius: 8px; box-shadow: var(--box-shadow-100); }
.guide summary { color: var(--gray-900); font-weight: 700; font-size: 14px; }
.guide ul { color: var(--gray-800); font-size: 12px; line-height: 18px; }
.guide b { color: var(--gray-900); font-weight: 700; }
.basebar, .resbar, .chips, .drillbar, .fallbacks { border-bottom-color: var(--gray-200); }
.body.stack .tblwrap { border-top-color: var(--gray-200); }
/* Btn: medium 32/6px/14px, small 24/4px/12px, 테두리는 inset 1px gray-300 */
.btn { height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--gray-900); font-size: 14px; font-weight: 400; box-shadow: inset 0 0 0 1px var(--gray-300); transition: background-color .18s, color .18s; }
.btn:hover:not(:disabled) { background: var(--overlay-100); }
.btn:active:not(:disabled) { background: var(--overlay-300); }
.btn:disabled { opacity: 1; background: var(--overlay-300); color: var(--gray-500); box-shadow: none; }
.btn.primary { background: var(--primary-700); color: var(--on-primary); box-shadow: none; font-weight: 400; }
.btn.primary:hover:not(:disabled) { filter: none; background: var(--primary-800); }
.btn.primary:disabled { background: var(--overlay-300); color: var(--gray-500); }
.btn.ghost { box-shadow: none; color: var(--gray-800); }
.btn.ghost:hover:not(:disabled) { color: var(--gray-900); background: var(--overlay-100); }
.btn.sm { height: 24px; padding: 0 8px; border-radius: 4px; font-size: 12px; }
.btn.pulse { box-shadow: 0 0 0 3px var(--primary-200); }
.btn:focus-visible { box-shadow: inset 0 0 0 1px var(--gray-700); }
.btn svg { width: 16px; height: 16px; }
.btn.sm svg { width: 14px; height: 14px; }
.ibtn { border-radius: 4px; color: var(--gray-600); transition: background-color .18s, color .18s; }
.ibtn:hover { background: var(--overlay-100); color: var(--gray-900); }
/* 입력: 32px, 반경 6px, inset 테두리 gray-300 / hover gray-500 / focus primary-700 */
.ctl { height: 32px; border: 0; border-radius: 6px; background: var(--surface-100); color: var(--gray-900); font-size: 14px; padding: 0 10px; box-shadow: inset 0 0 0 1px var(--gray-300); }
.ctl:hover { box-shadow: inset 0 0 0 1px var(--gray-500); }
.ctl:focus, .ctl:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--primary-700); }
.field > .k, .ctool .k { font-size: 12px; line-height: 18px; color: var(--gray-600); }
.chk { font-size: 14px; color: var(--gray-900); }
.chk input, .trow input { accent-color: var(--primary-700); width: 16px; height: 16px; }
.dirty { color: var(--orange-800); background: var(--orange-100); border-radius: 4px; font-size: 12px; line-height: 18px; padding: 3px 8px; }
.gbtn b { color: var(--primary-800); font-weight: 700; }
.gbtn small { color: var(--gray-500); font-size: 12px; }
.ddot { background: var(--orange-700); }
/* 결과 상단 */
.applied { font-size: 12px; line-height: 18px; color: var(--gray-600); }
.applied b { color: var(--gray-900); font-weight: 700; }
.why { color: var(--orange-800); font-size: 12px; }
/* SelectButton 형태의 보기·차트 전환 */
.seg { border: 0; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--gray-300); }
.seg button { height: 24px; padding: 0 10px; font-size: 12px; color: var(--gray-800); background: transparent; transition: background-color .18s, color .18s; }
.seg button + button { border-left: 1px solid var(--gray-300); }
.seg button:hover:not(:disabled) { background: var(--overlay-100); }
.seg button[aria-pressed="true"] { background: var(--primary-100); color: var(--primary-800); font-weight: 700; }
/* Chip: small 24/4px, 기본 gray-300 테두리 */
.chip { height: 24px; border: 0; border-radius: 4px; background: var(--surface-100); box-shadow: inset 0 0 0 1px var(--gray-300); font-size: 12px; color: var(--gray-900); }
.chip.emph { box-shadow: inset 0 0 0 1px var(--c); }
.chip.fail { background: var(--red-100); color: var(--red-800); box-shadow: none; }
.chip .when { color: var(--gray-500); }
.cglabel { font-size: 12px; line-height: 18px; color: var(--gray-600); }
.cglabel b { color: var(--gray-900); font-weight: 700; }
/* 드릴 바 */
.drillbar, .fallbacks { background: var(--gray-100); }
.crumbs { font-size: 12px; }
.crumbs button { color: var(--primary-700); border-radius: 4px; }
.crumbs button:hover { background: var(--overlay-primary-100); }
.crumbs .cur { color: var(--gray-900); font-weight: 700; }
.crumbs .sep { color: var(--gray-500); }
.api { border: 0; border-radius: 4px; background: var(--surface-100); box-shadow: inset 0 0 0 1px var(--gray-300); color: var(--gray-800); font-size: 12px; line-height: 18px; }
.api i { background: var(--green-700); }
.api.sec { background: var(--blue-100); color: var(--blue-900); box-shadow: none; }
.api.sec i { background: var(--blue-700); }
.selinfo { font-size: 12px; color: var(--gray-600); }
.selinfo b { color: var(--gray-900); font-weight: 700; }
.fb { background: var(--orange-100); color: var(--orange-800); border-radius: 4px; font-size: 12px; }
.tblsel { background: var(--overlay-primary-100); border-top-color: var(--gray-200); }
.empty-state { color: var(--gray-600); }
.loading { background: color-mix(in srgb, var(--surface-100) 55%, transparent); border-radius: 8px; }
.loading div { background: var(--surface-300); border: 0; border-radius: 8px; box-shadow: var(--box-shadow-400); color: var(--gray-900); }
.spin { border-color: var(--primary-200); border-top-color: var(--primary-700); }
/* 떠 있는 레이어: surface-300 + box-shadow-400 */
.pop { background: var(--surface-300); border: 0; border-radius: 6px; box-shadow: var(--box-shadow-400); }
.pop h4 { font-size: 12px; color: var(--gray-600); font-weight: 400; }
.pop .opt { border-radius: 4px; font-size: 14px; color: var(--gray-900); }
.pop .opt:hover:not(:disabled) { background: var(--overlay-100); }
.pop .opt small { color: var(--gray-500); }
/* Drawer·모달 */
.scrim { background: var(--mask); }
.drawer { background: var(--surface-100); border-left: 0; box-shadow: var(--box-shadow-700); }
.dh h3 { font-size: 16px; line-height: 24px; font-weight: 700; color: var(--gray-900); }
.dperiod, .esum, .gmsub { font-size: 12px; line-height: 18px; color: var(--gray-600); }
.esum, .gmsub { border-bottom-color: var(--gray-200); }
.esum b { color: var(--gray-900); font-weight: 700; }
.dtabs { border-bottom-color: var(--gray-200); }
.dtabs button { font-size: 14px; color: var(--gray-600); transition: color .18s; }
.dtabs button:hover { color: var(--gray-900); }
.dtabs button[aria-selected="true"] { color: var(--gray-900); font-weight: 700; border-bottom-color: var(--primary-700); }
.dconfirm { background: var(--orange-100); color: var(--orange-800); border-radius: 6px; }
.dtool { font-size: 12px; color: var(--gray-600); }
.tree { border: 0; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--gray-300); }
.trow { border-radius: 4px; font-size: 14px; }
.trow:hover { background: var(--overlay-100); }
.trow .chev { color: var(--gray-600); }
.trow .st { background: var(--green-700); }
.trow .st.stop { background: var(--gray-400); }
.trow .sub { color: var(--gray-500); font-size: 12px; }

/* ---------- 작업 중인 조건 + 마지막 적용 조건 (브라우저 저장) ---------- */
const SESSION_KEY = 'dbsearch-proto.session.v1';
let sessionReady = false, sessionSaveTimer = 0;

function sessionDefinition(base, groups, applied = false) {
  return {
    base: { date: base.date, days: base.days, opHours: !!base.opHours, weekendEx: !!base.weekendEx },
    groups: groups.map(g => ({
      id: g.id,
      ...(applied ? { no: g.no } : {}),
      period: { ...(g.period || { mode: g.shift ? 'shift' : 'inherit', shift: g.shift || -1, date: null }) },
      interval: applied && g.intervalInherit ? null : (g.interval ?? null),
      kind: g.kind, targets: [...g.targets], metric: g.metric, agg: g.agg,
    })),
  };
}

function readSessionDefinition(raw) {
  if (!raw || typeof raw !== 'object' || !raw.base || !Array.isArray(raw.groups)) throw new Error('Invalid session definition');
  const d = normalizeDefinition(raw);
  const validDate = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && dstr(dayStart(value)) === value;
  const b = d.base, days = b.days == null ? 7 : Number(b.days);
  if (!validDate(b.date) || !Number.isInteger(days) || days < 1 || days > 90) throw new Error('Invalid session range');
  const base = { date: b.date, days, opHours: b.opHours === true, weekendEx: b.weekendEx === true };
  const groups = d.groups.map(g => {
    if (!g || !Object.hasOwn(METRICS, g.metric) || !Object.hasOwn(KIND_LABEL, g.kind) || !Array.isArray(g.targets)) throw new Error('Invalid session group');
    if (!g.targets.every(id => Object.hasOwn(T, id) && T[id].kind === g.kind)) throw new Error('Invalid session target');
    if (!['AVG', 'MAX', 'SUM'].includes(g.agg)) throw new Error('Invalid session aggregation');
    const period = { mode: 'inherit', shift: -1, date: null, ...(g.period || {}) };
    if (!['inherit', 'shift', 'date'].includes(period.mode) || !Number.isSafeInteger(period.shift)) throw new Error('Invalid session period');
    if (!Number.isFinite(new Date((dayStart(base.date) + period.shift * DAY) * 1000).getTime())) throw new Error('Invalid session shift');
    if ((period.date != null && !validDate(period.date)) || (period.mode === 'date' && !period.date)) throw new Error('Invalid session comparison date');
    const interval = g.interval == null || g.interval === 'auto' ? null : Number(g.interval);
    if (interval != null && !INTERVALS.includes(interval)) throw new Error('Invalid session interval');
    return { id: g.id, period, interval, kind: g.kind, targets: [...new Set(g.targets)], metric: g.metric, agg: g.agg };
  });
  return { base, groups };
}

function saveSession() {
  if (!sessionReady) return false;

  try {
    const A = state.applied;
    const applied = A ? {
      ...sessionDefinition(A.base, A.groups, true),
      // Result deletion can change A.groups while a dirty draft keeps the original baseline.
      def: A.def,
      hidden: A.series.filter(s => s.hidden).map(s => s.key),
    } : null;
    localStorage.setItem(SESSION_KEY, JSON.stringify({ version: 1, draft: sessionDefinition(state.base, state.groups), applied }));
    return true;
  } catch { return false; /* 저장 불가 환경에서도 검색은 계속 동작 */ }
}

function queueSessionSave() {
  if (!sessionReady) return;
  clearTimeout(sessionSaveTimer);
  sessionSaveTimer = setTimeout(saveSession, 120);
}

function restoreSession() {
  const previous = { ...state }, previousUid = uid;
  const wasReady = sessionReady;
  sessionReady = false;
  try {
    const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!saved || saved.version !== 1) return false;
    const draft = readSessionDefinition(saved.draft);
    const applied = saved.applied == null ? null : readSessionDefinition(saved.applied);
    const baseline = applied && typeof saved.applied.def === 'string' ? readSessionDefinition(JSON.parse(saved.applied.def)) : applied;
    // 상대 날짜는 복원 시점의 오늘로 갱신하고, 직접 선택 날짜는 그대로 보존합니다.
    const today = todayKST();
    draft.base.date = today;
    if (applied) applied.base.date = today;
    if (baseline) baseline.base.date = today;
    if (applied?.groups.some(g => groupIssues(g).err.length)) return false;

    // Keep matching IDs on both sides; allocate replacements only for damaged IDs.
    const definitions = [draft, applied].filter(Boolean);
    const validId = id => Number.isSafeInteger(id) && id > 0 && id < 2 ** 31;
    let nextId = uid;
    definitions.forEach(d => d.groups.forEach(g => { if (validId(g.id)) nextId = Math.max(nextId, g.id + 1); }));
    definitions.forEach(d => {
      const used = new Set();
      d.groups.forEach(g => { if (!validId(g.id) || used.has(g.id)) g.id = nextId++; used.add(g.id); });
    });
    uid = nextId;
    state.applied = null; state.history = []; state.loading = false;
    state.sel = null; state.cell = null; state.hover = null; state.emph = null; state.errors = {}; state.queriedAt = null;
    if (applied) {
      state.base = applied.base; state.groups = applied.groups;
      if (applied.groups.length) {
        if (!runQuery(true)) throw new Error('Could not restore applied query');
      } else {
        // Every result can have been deleted, while a separate draft still exists.
        const base = { ...applied.base, resolvedInterval: resolveBaseInterval(applied.base) };
        state.applied = { base, groups: [], series: [], def: '' };
        state.history = [{ from: 0, to: base.days * DAY, res: base.resolvedInterval, api: 'min', data: null }];
        loadEntry(cur(), 0, '');
      }
      state.applied.def = JSON.stringify({ base: baseline.base, groups: baseline.groups.map(({ id, ...g }) => g) });
      state.applied.groups.forEach((g, i) => {
        const no = saved.applied.groups[i]?.no;
        if (Number.isSafeInteger(no) && no > 0) g.no = no;
      });
      const hidden = new Set(Array.isArray(saved.applied.hidden) ? saved.applied.hidden.filter(k => typeof k === 'string') : []);
      state.applied.series.forEach(s => { s.hidden = hidden.has(s.key); });
    }
    // Query the saved applied configuration first, then put back unsearched edits.
    state.base = draft.base; state.groups = draft.groups;
    renderBuilder(); renderResults();
    return true;
  } catch {
    Object.assign(state, previous); uid = previousUid;
    return false;
  } finally { sessionReady = wasReady; }
}

window.addEventListener('pagehide', saveSession);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveSession(); });

/* ---------- 시작: 저장된 조건 복원 또는 예시 검색 ---------- */
if (!restoreSession()) { renderBuilder(); runQuery(true); }
sessionReady = true;
saveSession();
})();
</script>

</body></html>
